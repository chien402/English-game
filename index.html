<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6eddc">
<title>艾登與露露：星星郵差的謎語</title>
<style>
:root{--ink:#344552;--muted:#71808a;--cream:#fffaf0;--paper:#fffdf8;--green:#638c74;--green-dark:#426d58;--peach:#efaa83;--gold:#e8bd60;--line:#eadfc9;--blue:#dcecf0;--shadow:0 18px 50px #6f755220}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 5%,#f8e7cf 0,transparent 34%),radial-gradient(ellipse at 90% 90%,#dcebe2 0,transparent 32%),#f5f0e5;color:var(--ink);font-family:ui-rounded,"Segoe UI",system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}
button{font:inherit}.game{width:min(1020px,100%);min-height:650px;background:var(--paper);border:1px solid #fff;border-radius:30px;overflow:hidden;box-shadow:var(--shadow);display:grid;grid-template-columns:36% 64%;position:relative}.scene{background:linear-gradient(165deg,#dcebdc,#c8dfd1 58%,#dfe9d9);padding:30px;position:relative;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}.scene:before,.scene:after{content:"";position:absolute;border-radius:50%;background:#ffffff3b}.scene:before{width:250px;height:250px;left:-110px;top:120px}.scene:after{width:340px;height:340px;right:-200px;bottom:-130px}.brand,.scene-art,.scene-caption{position:relative;z-index:1}.brand{font-size:12px;font-weight:800;letter-spacing:.12em;color:#51755f;text-transform:uppercase}.scene-art{display:grid;place-items:center;min-height:300px}.forest{font-size:112px;filter:drop-shadow(0 12px 7px #4e806c25);animation:float 4s ease-in-out infinite}.fox{position:absolute;font-size:65px;left:12%;bottom:14%;transform:rotate(-8deg);filter:drop-shadow(0 8px 5px #4e806c22)}.mail{position:absolute;font-size:54px;right:13%;top:17%;transform:rotate(8deg)}.spark{position:absolute;font-size:24px;color:#fff5c8}.spark.one{top:9%;left:22%}.spark.two{right:22%;bottom:23%;font-size:18px}@keyframes float{50%{transform:translateY(-9px)}}
.scene-caption h2{font-family:Georgia,serif;font-size:26px;margin:0 0 8px}.scene-caption p{line-height:1.65;margin:0;color:#577263;font-size:14px}.panel{padding:30px 40px 34px;display:flex;flex-direction:column}.topline{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px;font-weight:700}.badge{background:#f4eddc;color:#8b7344;padding:8px 12px;border-radius:999px;font-size:12px}.progress-wrap{margin:22px 0 25px}.progress-label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:8px}.track{height:8px;border-radius:99px;background:#eee8dc;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#75a384,#b3cf9d);border-radius:99px;transition:width .4s ease}.content{flex:1}.eyebrow{font-size:12px;letter-spacing:.1em;color:#9b8866;font-weight:800;text-transform:uppercase}.title{font-family:Georgia,"Noto Serif TC",serif;font-size:clamp(25px,3.2vw,35px);line-height:1.25;margin:10px 0 12px;color:#384c4c}.story{font-size:15px;line-height:1.85;color:#63727a;margin:0 0 22px}.dialogue{background:#f3f7f1;border:1px solid #e2ebdf;border-radius:16px;padding:13px 16px;margin:0 0 20px;color:#526b5a;font-size:14px;line-height:1.65}.dialogue b{color:var(--green-dark)}.question{font-size:16px;font-weight:800;margin:0 0 12px}.answers{display:grid;gap:10px}.answer{border:1.5px solid var(--line);background:#fffefa;border-radius:13px;text-align:left;padding:13px 15px;color:#455660;cursor:pointer;transition:.18s}.answer:hover{transform:translateY(-1px);border-color:#9cb9a3;background:#f8fbf6}.answer:focus-visible,.primary:focus-visible{outline:3px solid #e8bd60;outline-offset:2px}.answer.correct{border-color:#78a588;background:#edf6ee;color:#37664b}.answer.wrong{border-color:#e6aa8b;background:#fff2e9;color:#9a5d44;animation:shake .25s}@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}.feedback{min-height:48px;margin-top:13px;font-size:13px;line-height:1.55;color:#6a777c}.feedback.good{color:#477856}.feedback.try{color:#a36b4e}.footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px}.hint{border:0;background:transparent;color:#7a8c7f;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:10px 0;font-size:13px}.primary{border:0;border-radius:12px;background:var(--green);color:white;font-weight:800;padding:12px 19px;cursor:pointer;box-shadow:0 5px 12px #426d5825;transition:.2s}.primary:hover{background:var(--green-dark);transform:translateY(-1px)}.primary:disabled{opacity:.45;cursor:not-allowed;transform:none}.hidden{display:none!important}.end{text-align:center;padding:45px 20px}.end .bigstar{font-size:68px}.end h2{font: bold 34px Georgia,serif;margin:10px 0}.end p{line-height:1.8;color:#66747a;max-width:390px;margin:0 auto 20px}.word-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:22px 0}.word-chips span{background:#f2f5ed;border:1px solid #e2eadc;border-radius:99px;padding:7px 11px;font-size:12px;color:#56745d}.smallnote{font-size:11px;color:#9a9b91;margin-top:18px}.star{position:absolute;top:-12px;right:18px;color:#f1cf76;font-size:18px}@media(max-width:760px){body{padding:12px}.game{grid-template-columns:1fr;min-height:min(90vh,850px);border-radius:23px}.scene{min-height:185px;padding:19px 22px;flex-direction:row;align-items:center}.scene-art{min-height:140px;position:absolute;right:5%;width:48%;top:5px}.forest{font-size:88px}.fox{font-size:46px;left:7%;bottom:11%}.mail{font-size:38px}.scene-caption{max-width:53%;align-self:end}.scene-caption h2{font-size:20px}.scene-caption p{font-size:12px}.panel{padding:22px 22px 24px}.progress-wrap{margin:15px 0 18px}.story{margin-bottom:16px}.end{padding:20px 8px}}
</style>
</head>
<body>
<main class="game" aria-live="polite">
  <aside class="scene" aria-label="森林冒險場景">
    <div class="brand">✦ Little Word Quest</div>
    <div class="scene-art" aria-hidden="true"><span class="forest">🌲</span><span class="fox">🦊</span><span class="mail">✉️</span><span class="spark one">✦</span><span class="spark two">✧</span></div>
    <div class="scene-caption"><h2>星星郵差的謎語</h2><p>跟著艾登和露露，踏上森林裡的小小冒險。</p></div>
  </aside>
  <section class="panel">
    <div class="topline"><span>艾登 &amp; 露露的冒險日記</span><span class="badge">英文單字 · Level 4</span></div>
    <div class="progress-wrap"><div class="progress-label"><span id="stepLabel">序章</span><span id="countLabel">準備出發</span></div><div class="track"><div class="fill" id="progress"></div></div></div>
    <div class="content" id="playArea"></div>
  </section>
</main>
<script>
const steps=[
 {tag:'任務 1 · 林間小徑',title:'信差帶來一封信',story:'黃昏時，一位旅人匆匆走進村莊。他把一封信交給艾登，說森林深處有一顆小星星需要幫忙。',line:'“I am the <b>messenger</b>. Please help the little star!” 露露眨眨眼：「我們先看看他是誰吧。」',q:'What is a messenger?',a:['A person who carries a message','A person who grows flowers','A person who fixes clocks'],ok:0,ex:'A messenger carries a message from one person to another.',hint:'想想看：誰會負責把信送到收件人手上？',word:'messenger'},
 {tag:'任務 2 · 神祕信件',title:'信裡藏著什麼？',story:'信封上沒有寄件人的名字，紙上還閃著淡淡的藍光。露露覺得這封信有點不尋常。',line:'“This letter is <b>mysterious</b>,” says Lulu. “We don’t know who sent it or what will happen next!”',q:'If something is mysterious, it is…',a:['easy to understand','strange or hard to understand','very ordinary'],ok:1,ex:'Mysterious describes something strange or difficult to understand.',hint:'信件的來源和內容都還是個謎喔。',word:'mysterious'},
 {tag:'任務 3 · 月光橋邊',title:'解開星星留下的謎語',story:'信裡有一道謎語：「我沒有門，卻能保護你躲過風雨；累了的人可以在我這裡休息。我是什麼？」',line:'“A <b>riddle</b> is a puzzle with a hidden answer,” Lulu explains. “Let’s solve it together!”',q:'What does “riddle” mean?',a:['A puzzle that asks you to find an answer','A song for falling asleep','A map of the forest'],ok:0,ex:'A riddle is a question or puzzle with a hidden answer.',hint:'把剛剛信裡那段需要猜答案的文字想一想。',word:'riddle'},
 {tag:'任務 4 · 森林小屋',title:'找到安全的藏身處',story:'謎底指向森林邊的一間小屋。裡頭傳來微弱的星光，原來小星星躲在裡面避雨。',line:'“A <b>shelter</b> is a safe place that protects you from danger or bad weather.”',q:'Which place could be a shelter?',a:['A safe hut where someone can hide from a storm','A bright star high in the sky','A letter sent by a friend'],ok:0,ex:'A shelter is a place that gives protection.',hint:'小星星在下雨時躲進去，能保護牠的地方就是答案。',word:'shelter'},
 {tag:'任務 5 · 星光救援',title:'帶小星星回家',story:'小星星的光芒越來越暗。艾登伸出雙手，露露在旁邊照亮回村的路。他們一起把小星星帶離森林。',line:'“Let’s <b>rescue</b> the little star and take it home!” Aiden says.',q:'To rescue someone means to…',a:['save them from danger','ask them a riddle','give them a present'],ok:0,ex:'To rescue someone is to save them from danger.',hint:'艾登和露露正在幫小星星脫離困境。',word:'rescue'},
 {tag:'任務 6 · 村莊慶典',title:'一份暖暖的獎勵',story:'小星星重新亮了起來，村莊也被照得金光閃閃。大家為艾登和露露準備了一籃莓果，謝謝他們的幫忙。',line:'“You both did a wonderful job. Here is your <b>reward</b>!” the villagers cheer.',q:'What is a reward?',a:['Something given to thank someone for good work','A place to hide from rain','A difficult question'],ok:0,ex:'A reward is something given because of good work or an achievement.',hint:'村民為了感謝他們完成任務，送上了什麼呢？',word:'reward'}
];
let current=-1,locked=false;
const area=document.getElementById('playArea'),progress=document.getElementById('progress'),stepLabel=document.getElementById('stepLabel'),countLabel=document.getElementById('countLabel');
function start(){current=0;render()}
function render(){locked=false;const s=steps[current];stepLabel.textContent=s.tag;countLabel.textContent=`${current+1} / ${steps.length}`;progress.style.width=`${(current/steps.length)*100}%`;area.innerHTML=`<div class="eyebrow">${s.tag}</div><h1 class="title">${s.title}</h1><p class="story">${s.story}</p><div class="dialogue">${s.line}</div><p class="question">${s.q}</p><div class="answers">${s.a.map((x,i)=>`<button class="answer" data-i="${i}">${String.fromCharCode(65+i)}　${x}</button>`).join('')}</div><div class="feedback" id="feedback" role="status"></div><div class="footer"><button class="hint" id="hint">給我一點提示</button><button class="primary hidden" id="next">繼續冒險 →</button></div><div class="smallnote">答錯也沒關係，露露會陪你再想一想。</div>`;
area.querySelectorAll('.answer').forEach(b=>b.addEventListener('click',()=>choose(Number(b.dataset.i),b)));document.getElementById('hint').addEventListener('click',()=>{document.getElementById('feedback').textContent='露露的提示：'+s.hint;document.getElementById('feedback').className='feedback try'});document.getElementById('next').addEventListener('click',()=>{current++;current<steps.length?render():finish()})}
function choose(i,btn){if(locked)return;const s=steps[current],fb=document.getElementById('feedback');if(i===s.ok){locked=true;btn.classList.add('correct');area.querySelectorAll('.answer').forEach(b=>b.disabled=true);fb.textContent='答對了！'+s.ex;fb.className='feedback good';document.getElementById('hint').classList.add('hidden');document.getElementById('next').classList.remove('hidden');progress.style.width=`${((current+1)/steps.length)*100}%`}else{btn.classList.add('wrong');fb.textContent='差一點點，再想想看，或點「給我一點提示」。';fb.className='feedback try';setTimeout(()=>btn.classList.remove('wrong'),400)}}
function finish(){stepLabel.textContent='任務完成';countLabel.textContent='6 / 6';progress.style.width='100%';area.innerHTML=`<div class="end"><div class="bigstar">🌟</div><div class="eyebrow">森林村莊恢復光亮了</div><h2>太棒了，探險家！</h2><p>你和艾登、露露一起幫小星星平安回家，也在冒險中遇見了六個 Level 4 單字。</p><div class="word-chips">${steps.map(s=>`<span>${s.word}</span>`).join('')}</div><button class="primary" id="again">再玩一次</button></div>`;document.getElementById('again').addEventListener('click',start)}
area.innerHTML=`<div class="eyebrow">童話冒險 · 第一章</div><h1 class="title">星星郵差的謎語</h1><p class="story">一封神祕的信帶來森林深處的求救訊息。艾登和小狐狸露露準備出發，尋找那顆走失的小星星。途中會遇到六個英文單字任務，每答對一題，就能更靠近牠一點。</p><div class="dialogue"><b>露露：</b>「準備好一起出發了嗎？別擔心，我會一直陪著你！」</div><p class="question">你的任務</p><div class="dialogue">讀懂線索、解開謎語，帶小星星安全回家。選錯時可以再試，也可以向露露要提示。</div><div class="footer"><span></span><button class="primary" id="start">開始冒險 →</button></div><div class="smallnote">本章字彙依大考中心《高中英文參考詞彙表》Level 4 候選詞設計。</div>`;document.getElementById('start').addEventListener('click',start);
</script>
</body>
</html>
